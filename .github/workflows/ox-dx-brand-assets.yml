name: OX-DX Brand Asset Renderer

on:
  push:
    branches:
      - feature/ox-dx-brand-assets

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore deterministic asset renderer
        run: |
          mkdir -p assets/source/design
          base64 -d .github/oxdx-brand-renderer.b64 | gzip -d > assets/source/design/render_brand_assets.py
      - name: Install rendering dependencies
        run: python -m pip install --disable-pip-version-check cairosvg pillow matplotlib
      - name: Render and validate OX-DX assets
        run: python assets/source/design/render_brand_assets.py
      - name: Commit generated brand system
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "feat(branding): add OX-DX visual asset system"
          git push origin HEAD:feature/ox-dx-brand-assets
