name: Repository Docs Sync

on:
  workflow_run:
    workflows:
      - "Validate Universal Ontology Engine"
      - "Release Channels"
      - "Stable Back Sync"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: repository-docs-sync
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.name == 'Release Channels' ||
          github.event.workflow_run.name == 'Stable Back Sync' ||
          (
            github.event.workflow_run.name == 'Validate Universal Ontology Engine' &&
            github.event.workflow_run.head_branch == 'main'
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Fetch branch and release state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main dev --tags
          main_version="$(git show origin/main:Cargo.toml | awk -F'"' '/^version = / {print $2; exit}')"
          dev_version="$(git show origin/dev:Cargo.toml | awk -F'"' '/^version = / {print $2; exit}')"
          stable_release="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Ev '-' | head -n1 || true)"
          dev_release="$(git tag -l 'v*-dev.*' --sort=-v:refname | head -n1 || true)"
          main_sha="$(git rev-parse origin/main)"
          dev_sha="$(git rev-parse origin/dev)"
          if [[ "$main_sha" == "$dev_sha" ]]; then
            relation=aligned
          elif git merge-base --is-ancestor "$main_sha" "$dev_sha"; then
            relation=dev_ahead
          elif git merge-base --is-ancestor "$dev_sha" "$main_sha"; then
            relation=main_ahead
          else
            relation=diverged
          fi
          ci_state="$(gh run list --workflow 'Validate Universal Ontology Engine' --branch main --limit 1 --json conclusion --jq '.[0].conclusion // "unknown"')"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" > /tmp/releases.json
          python tools/repo_status.py \
            --main-version "$main_version" \
            --dev-version "$dev_version" \
            --stable-release "$stable_release" \
            --dev-release "$dev_release" \
            --branch-relation "$relation" \
            --ci-state "$ci_state"
          python tools/sync_repository_docs.py --releases-json /tmp/releases.json
      - name: Commit generated repository docs
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- README.md CHANGELOG.md .ontology/status.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md CHANGELOG.md .ontology/status.json
            git commit -m "chore(release): sync generated repository docs"
            git push origin HEAD:main
          else
            echo "repository docs already synchronized"
          fi

      - name: Keep dev aligned when main is ahead
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main dev
          main_head="$(git rev-parse origin/main)"
          dev_head="$(git rev-parse origin/dev)"
          if [[ "$main_head" == "$dev_head" ]]; then
            echo "main/dev already aligned"
          elif git merge-base --is-ancestor "$dev_head" "$main_head"; then
            git push origin "$main_head:dev"
            echo "dev fast-forwarded to generated main state"
          else
            echo "dev is not behind main; no docs back-sync performed"
          fi
