name: Validate Universal Ontology Engine

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enforce branch flow
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$BASE_BRANCH" == "dev" && "$HEAD_BRANCH" == feature/* ]]; then
            echo "allowed: feature/* -> dev"
          elif [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" == "dev" ]]; then
            echo "allowed: dev -> main"
          else
            echo "invalid branch flow: ${HEAD_BRANCH} -> ${BASE_BRANCH}" >&2
            echo "allowed flows: feature/* -> dev, dev -> main" >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Validate JSON documents
        run: |
          python -m json.tool universe.json >/dev/null
          python -m json.tool .ontology/self.json >/dev/null
          python -m json.tool specifications/universe-contract.json >/dev/null
          python -m json.tool specifications/universe-contract.instance.json >/dev/null
          python -m json.tool specifications/foundation-contract.json >/dev/null
          python -m json.tool specifications/foundation-contract.instance.json >/dev/null
          python -m json.tool specifications/universal-ontology-v1.0.json >/dev/null
          python -m json.tool schemas/universe.schema.json >/dev/null
          python -m json.tool schemas/foundation-node.schema.json >/dev/null
          python -m json.tool schemas/hierarchy-node.schema.json >/dev/null
          python -m json.tool schemas/universal-ontology.schema.json >/dev/null
      - name: Validate canonical ontology contract
        run: python tools/validate-universe.py
      - name: Validate Python registry and discovery tooling
        run: |
          python -m compileall -q tools tests
          python tools/universe_cli.py --manifest universe.json validate
          python tools/universe_cli.py --manifest universe.json --json list
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and test Rust engine
        run: |
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace --all-targets
      - name: Self inspection gate
        run: |
          cargo run -p ontology-engine -- self --json > /tmp/ontology-self.json
          python -m json.tool /tmp/ontology-self.json >/dev/null
          diff -u .ontology/self.json /tmp/ontology-self.json
          cat /tmp/ontology-self.json
      - name: Smoke test ontology CLI
        run: |
          cargo run -p ontology-engine -- levels
          cargo run -p ontology-engine -- inspect 49
          cargo run -p ontology-engine -- discover . --max-depth 2
