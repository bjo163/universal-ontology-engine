name: Validate Universal Ontology Engine

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Validate JSON documents
        run: |
          python -m json.tool universe.json >/dev/null
          python -m json.tool specifications/universe-contract.json >/dev/null
          python -m json.tool specifications/universe-contract.instance.json >/dev/null
          python -m json.tool specifications/foundation-contract.json >/dev/null
          python -m json.tool specifications/foundation-contract.instance.json >/dev/null
          python -m json.tool specifications/universal-ontology-v1.0.json >/dev/null
          python -m json.tool schemas/universe.schema.json >/dev/null
          python -m json.tool schemas/foundation-node.schema.json >/dev/null
          python -m json.tool schemas/universal-ontology.schema.json >/dev/null
      - name: Validate canonical ontology contract
        run: python tools/validate-universe.py
      - name: Validate Python registry and discovery tooling
        run: |
          python -m compileall -q tools tests
          python tools/universe_cli.py --manifest universe.json validate
          python tools/universe_cli.py --manifest universe.json --json list
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and test Rust engine
        run: |
          cargo fmt --all
          cargo check --workspace
          cargo test --workspace --all-targets
      - name: Smoke test ontology CLI
        run: |
          cargo run -p ontology-engine -- levels
          cargo run -p ontology-engine -- inspect 49
