name: Validate Universal Ontology Engine

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enforce branch flow
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$BASE_BRANCH" == "dev" && "$HEAD_BRANCH" == feature/* ]]; then
            echo "allowed: feature/* -> dev"
          elif [[ "$BASE_BRANCH" == "main" && "$HEAD_BRANCH" == "dev" ]]; then
            echo "allowed: dev -> main"
          else
            echo "invalid branch flow: ${HEAD_BRANCH} -> ${BASE_BRANCH}" >&2
            echo "allowed flows: feature/* -> dev, dev -> main" >&2
            exit 1
          fi

      - name: Enforce issue linkage
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(python tools/check_pr_issue.py --body "$PR_BODY")"
          issue_state="$(gh issue view "$issue_number" --json state --jq '.state')"
          if [[ "$issue_state" != "OPEN" ]]; then
            echo "linked issue #${issue_number} is not open" >&2
            exit 1
          fi
          echo "feature PR linked to open issue #${issue_number}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Validate JSON documents
        run: |
          python -m json.tool universe.json >/dev/null
          python -m json.tool .ontology/self.json >/dev/null
          python -m json.tool specifications/universe-contract.json >/dev/null
          python -m json.tool specifications/universe-contract.instance.json >/dev/null
          python -m json.tool specifications/foundation-contract.json >/dev/null
          python -m json.tool specifications/foundation-contract.instance.json >/dev/null
          python -m json.tool specifications/universal-ontology-v1.0.json >/dev/null
          python -m json.tool specifications/language-capabilities-v1.json >/dev/null
          python -m json.tool specifications/external-reference-matrix-v1.json >/dev/null
          python -m json.tool schemas/universe.schema.json >/dev/null
          python -m json.tool schemas/foundation-node.schema.json >/dev/null
          python -m json.tool schemas/hierarchy-node.schema.json >/dev/null
          python -m json.tool schemas/universal-ontology.schema.json >/dev/null
          python -m json.tool schemas/discovery-output-v1.schema.json >/dev/null
          python -m json.tool governance/performance-baseline-v0.1.10.json >/dev/null
      - name: Validate Python registry and discovery tooling
        run: |
          python -m compileall -q tools tests
          python tools/universe_cli.py --manifest universe.json validate
          python tools/universe_cli.py --manifest universe.json --json list
          python tools/repo_status.py --help >/dev/null
          python tools/sync_repository_docs.py --help >/dev/null
          python tools/mvp_benchmark.py --help >/dev/null
          python tools/check_mvp_performance.py --help >/dev/null
          test "$(python tools/check_pr_issue.py --body 'Refs #6')" = "6"
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and test Rust engine
        run: |
          cargo fmt --all -- --check
          cargo check --workspace
          cargo test --workspace --all-targets
          cargo build -p ontology-engine
      - name: Check MVP performance regression budget
        run: |
          python tools/mvp_benchmark.py \
            --binary target/debug/ontology-engine \
            --output /tmp/mvp-benchmark.json \
            --runs 3
          python -m json.tool /tmp/mvp-benchmark.json >/dev/null
          python tools/check_mvp_performance.py \
            --baseline governance/performance-baseline-v0.1.10.json \
            --current /tmp/mvp-benchmark.json \
            --factor 3
      - name: Self inspection gate
        run: |
          cargo run -p ontology-engine -- self --json > /tmp/ontology-self.json
          python -m json.tool /tmp/ontology-self.json >/dev/null
          diff -u .ontology/self.json /tmp/ontology-self.json
          cat /tmp/ontology-self.json
      - name: Smoke test ontology CLI
        run: |
          set -euo pipefail
          cargo run -p ontology-engine -- levels
          cargo run -p ontology-engine -- inspect 49
          cargo run -p ontology-engine -- discover . --max-depth 2 > /tmp/structural.json
          cargo run -p ontology-engine -- discover crates/ontology-core --rust-ast --max-depth 4 > /tmp/rust-ast.json
          cargo run -p ontology-engine -- discover crates/ontology-core --syntax --max-depth 4 > /tmp/syntax.json
          python - <<'PY'
          import json
          from pathlib import Path

          structural = json.loads(Path('/tmp/structural.json').read_text())
          rust_ast = json.loads(Path('/tmp/rust-ast.json').read_text())
          syntax = json.loads(Path('/tmp/syntax.json').read_text())

          for payload in (structural, rust_ast, syntax):
              assert payload.get('schema') == 'universal-ontology-engine/discovery-v1', payload
              assert payload.get('read_only') is True, payload
              assert payload.get('nodes', 0) > 0, payload

          assert structural.get('mode') == 'structural', structural
          assert rust_ast.get('mode') == 'rust-ast', rust_ast
          assert syntax.get('mode') == 'syntax-projection', syntax
          assert any(key.startswith('34_FUNCTION') for key in rust_ast.get('nodes_by_level', {})), rust_ast
          assert any(key.startswith('34_FUNCTION') for key in syntax.get('nodes_by_level', {})), syntax
          PY
          if cargo run -p ontology-engine -- discover crates/ontology-core --syntax --rust-ast --max-depth 4 >/tmp/conflict.out 2>/tmp/conflict.err; then
            echo "--syntax and --rust-ast unexpectedly accepted together" >&2
            exit 1
          fi
          grep -q "cannot be used with" /tmp/conflict.err

  windows-path-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Verify Windows CLI/path contract
        shell: pwsh
        run: |
          cargo test -p ontology-engine --test mvp_exit_cli --test mvp_fixtures
          cargo build -p ontology-engine
          .\target\debug\ontology-engine.exe --registry specifications\universal-ontology-v1.0.json discover fixtures\mvp\typescript --syntax | Out-File -Encoding utf8 $env:RUNNER_TEMP\windows-discovery.json
          $report = Get-Content $env:RUNNER_TEMP\windows-discovery.json -Raw | ConvertFrom-Json
          if ($report.schema -ne "universal-ontology-engine/discovery-v1") { throw "unexpected schema" }
          if ($report.mode -ne "syntax-projection") { throw "unexpected mode" }
          if ($report.workspace -match "\\") { throw "workspace path is not normalized to logical slash form" }
