[workspace]
members = [
  "crates/ontology-core",
  "crates/ontology-graph",
  "crates/ontology-registry",
  "crates/ontology-discovery",
  "crates/ontology-rust",
  "crates/ontology-language",
  "crates/ontology-semantic",
  "crates/ontology-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.11-dev.32"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
