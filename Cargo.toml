[workspace]
members = [
  "crates/ontology-core",
  "crates/ontology-graph",
  "crates/ontology-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
