<text x="98" y="175" fill="#F5F7F8" font-family="Arial, sans-serif" font-size="54" font-weight="700">EVIDENCE FIRST.</text>
<text x="98" y="231" fill="#99A2AA" font-family="Arial, sans-serif" font-size="24">Observe what exists. Preserve the trace.</text>
<text x="98" y="273" fill="#99A2AA" font-family="Arial, sans-serif" font-size="24">Resolve only what the evidence supports.</text>
