[package]
name = "ontology-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "ontology-engine"

[[bin]]
name = "ontology-engine"
path = "src/main.rs"

[[bin]]
name = "ontology-syntax-discover"
path = "src/bin/syntax_discover.rs"

[dependencies]
ontology-core = { path = "../ontology-core" }
ontology-registry = { path = "../ontology-registry" }
ontology-discovery = { path = "../ontology-discovery" }
ontology-language = { path = "../ontology-language" }
ontology-rust = { path = "../ontology-rust" }
clap.workspace = true
serde_json.workspace = true
